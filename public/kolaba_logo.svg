<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="kolaba_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="kolaba_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="kolaba_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#kolaba_bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" stroke="url(#kolaba_teal)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Circuit Micro-grid Lines -->
  <path d="M 22 50 H 32 M 68 50 H 78 M 50 22 V 32 M 50 68 V 78" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="22" cy="50" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="78" cy="50" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="50" cy="22" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="50" cy="78" r="2" fill="#38BDF8" opacity="0.7"/>

  <!-- Kolaba "K" AI Monogram -->
  <!-- Vertical Stem -->
  <rect x="32" y="26" width="9" height="48" rx="4.5" fill="url(#kolaba_teal)" filter="url(#glow)"/>

  <!-- Upper Diagonal Wing -->
  <path d="M 45 48 L 63 30 C 65 28 69 29 69 33 C 69 35 68 37 66 39 L 51 54 Z" fill="url(#kolaba_cyan)"/>

  <!-- Lower Diagonal Wing -->
  <path d="M 46 48 L 65 67 C 67 69 69 71 67 74 C 65 76 62 76 60 74 L 42 56 Z" fill="url(#kolaba_teal)"/>

  <!-- Central Quantum Pulse Dot -->
  <circle cx="48" cy="50" r="3.5" fill="#FFFFFF"/>
</svg>
